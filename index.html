<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Объектив — Демо — горы</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}#panel{position:fixed;z-index:10;top:12px;left:12px;right:12px;padding:12px;border-radius:12px;background:#111d;text-align:center}button{border:0;border-radius:9px;background:#e6bd71;padding:11px 16px;font-weight:700}#status{margin:8px 0;font-size:13px}small{color:#ddd}</style></head><body><div id="panel"><b>Объектив • Оживающая фотография</b><p id="status">Разрешите камеру и наведите её на фотографию.</p><button id="sound">Включить звук</button><p><small>Камера обрабатывается в браузере; запись не ведётся.</small></p></div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-assets><video id="clip" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="marker" mindar-image-target="targetIndex: 0"><a-video src="#clip" position="0 0 0.005" width="1" height="1.33333"></a-video></a-entity></a-scene><script>const v=document.querySelector('#clip'),s=document.querySelector('#status'),b=document.querySelector('#sound'),m=document.querySelector('#marker');let wantsSound=false,visible=false;b.addEventListener('click',async()=>{wantsSound=true;v.muted=false;b.textContent='Звук включён';try{await v.play();if(!visible){v.pause();v.currentTime=0}}catch(e){s.textContent='Если звук не запустился, коснитесь кнопки ещё раз.'}});m.addEventListener('targetFound',async()=>{visible=true;s.textContent='Фотография найдена!';v.currentTime=0;try{await v.play()}catch(e){s.textContent='Нажмите «Включить звук» для запуска видео.'}});m.addEventListener('targetLost',()=>{visible=false;v.pause();s.textContent='Наведите камеру на фотографию.'});window.addEventListener('pagehide',()=>v.pause());</script></body></html>
